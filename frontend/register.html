<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Rally</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >
</head>

<body>

<nav>
    <a href="index.html">Rally</a>
    <a href="games.html">Games</a>
    <a href="login.html">Login</a>
</nav>

<main class="container">

    <div class="card">

        <h1>Create Account</h1>

        <form id="register-form">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
            >


            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                minlength="3"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                minlength="8"
                required
            >


            <label for="skill-level">
                Skill Level
            </label>

            <select id="skill-level">

                <option value="">
                    Select one
                </option>

                <option value="beginner">
                    Beginner
                </option>

                <option value="intermediate">
                    Intermediate
                </option>

                <option value="advanced">
                    Advanced
                </option>

                <option value="competitive">
                    Competitive
                </option>

            </select>


            <label for="position">
                Preferred Position
            </label>

            <select id="position">

                <option value="">
                    Select one
                </option>

                <option value="setter">
                    Setter
                </option>

                <option value="outside">
                    Outside
                </option>

                <option value="opposite">
                    Opposite
                </option>

                <option value="middle">
                    Middle
                </option>

                <option value="libero">
                    Libero
                </option>

                <option value="ds">
                    Defensive Specialist
                </option>

                <option value="any">
                    Any
                </option>

            </select>


            <button type="submit">
                Create Account
            </button>

        </form>


        <div
            id="register-message"
            class="message hidden"
        ></div>

    </div>

</main>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
