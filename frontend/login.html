<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Rally</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >
</head>

<body>

<nav>
    <a href="index.html">Rally</a>
    <a href="games.html">Games</a>
    <a href="register.html">Register</a>
</nav>

<main class="container">

    <div class="card">

        <h1>Login</h1>

        <form id="login-form">

            <label for="login-username">
                Username
            </label>

            <input
                id="login-username"
                type="text"
                required
            >


            <label for="login-password">
                Password
            </label>

            <input
                id="login-password"
                type="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div
            id="login-message"
            class="message hidden"
        ></div>

    </div>

</main>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
